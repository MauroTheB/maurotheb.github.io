<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente cyber-neon coerente con la palette del sito -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="padShadow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>

  <!-- Sfondo rotondo scuro con bordo luminescente -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#padShadow)" stroke="url(#neonGlow)" stroke-width="3" />

  <!-- Sagoma Game Controller ergonomica -->
  <path d="M18 24C16.8954 24 16 24.8954 16 26V34C16 39.5228 20.4772 44 26 44C28.4545 44 30.6976 43.1165 32 41.6575C33.3024 43.1165 35.5455 44 38 44C43.5228 44 48 39.5228 48 34V26C48 24.8954 47.1046 24 46 24H18Z" fill="#1e1b4b" stroke="url(#neonGlow)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- D-Pad Direzionale a Croce (Sinistra) -->
  <path d="M22 29V37M18 33H26" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Action Buttons Diamante (Destra) -->
  <circle cx="39" cy="30.5" r="1.5" fill="#f43f5e" />
  <circle cx="43" cy="30.5" r="1.5" fill="#fbbf24" />
  <circle cx="41" cy="28.5" r="1.5" fill="#38bdf8" />
  <circle cx="41" cy="32.5" r="1.5" fill="#34d399" />
</svg>